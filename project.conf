name: ps-printer-app
min-version: 2.5
element-path: elements

aliases:
  github: https://github.com/
  salsa: https://salsa.debian.org/
  pypi: https://files.pythonhosted.org/packages/

options:
  arch:
    type: arch
    description: Native OCI architecture
    variable: arch
    values:
      - aarch64
      - x86_64

variables:
  abi: gnu
  gcc-triplet: "%{arch}-linux-%{abi}"
  lib: "lib/%{gcc-triplet}"
  libdir: "%{prefix}/%{lib}"
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
    - arch == "aarch64":
        go-arch: "arm64"

sandbox:
  build-arch: "%{arch}"

artifacts:
  - url: https://gbm.gnome.org:11003
  - url: https://cache.projectbluefin.io:11001

source-caches:
  - url: https://gbm.gnome.org:11003
  - url: https://cache.projectbluefin.io:11001

# This junction is only needed to load the git_repo source plugin. It owns no
# CUPS artifacts and is independent of the same plugin inside ghostscript-fsdk.
junctions:
  internal:
    - plugins/buildstream-plugins-community.bst

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - git_repo

sources:
  git_repo:
    config:
      ref-format: git-describe
