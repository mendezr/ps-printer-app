name: Publish immutable FSDK OCI release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ps-oci-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ps-printer-app

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require upstream PPD upload security sign-off
        env:
          PPD_UPLOAD_SECURITY_APPROVED: ${{ vars.PPD_UPLOAD_SECURITY_APPROVED }}
        run: |
          if [[ "$PPD_UPLOAD_SECURITY_APPROVED" != true ]]; then
            printf '%s\n' 'Public PS image release is blocked until upstream PPD upload security sign-off.' >&2
            exit 1
          fi
      - name: Validate stable HEAD, version and pinned upstream FSDK
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(< VERSION)"
          [[ "$RELEASE_TAG" == "v${version}" ]]
          git fetch origin stable
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/stable)" ]]
          junction_ref="$(sed -n 's/^[[:space:]]*ref: .*g\([0-9a-f]\{40\}\)$/\1/p' elements/ghostscript-fsdk.bst)"
          [[ "$junction_ref" =~ ^[0-9a-f]{40}$ ]]
          upstream="$(mktemp -d)"
          trap 'rm -rf "$upstream"' EXIT
          git -C "$upstream" init -q
          git -C "$upstream" fetch -q --depth=1 https://github.com/projectbluefin/ghostscript-printer-app.git "$junction_ref"
          junction="$(git -C "$upstream" show FETCH_HEAD:elements/freedesktop-sdk.bst)"
          ref_line="$(sed -n 's/^[[:space:]]*ref: freedesktop-sdk-\(.*\)-0-g\([0-9a-f]\{40\}\)$/\1 \2/p' <<< "$junction")"
          read -r fsdk_version fsdk_ref <<< "$ref_line"
          [[ -n "$fsdk_version" && "$fsdk_ref" =~ ^[0-9a-f]{40}$ ]]
          grep -qF "'io.projectbluefin.fsdk.version': '$fsdk_version'" elements/oci/ps-printer-app.bst
          grep -qF "'io.projectbluefin.fsdk.ref': '$fsdk_ref'" elements/oci/ps-printer-app.bst
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install native builder prerequisites
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Build and verify both real IPP protocols and PostScript socket output
        run: just fetch && just verify
      - name: Add immutable release labels and archive verified image
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          source_image='ghcr.io/projectbluefin/ps-printer-app:build'
          container="$(podman create "$source_image")"
          trap 'podman rm "$container" >/dev/null 2>&1 || true' EXIT
          podman commit --format oci \
            --change "LABEL org.opencontainers.image.version=$VERSION" \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.opencontainers.image.created=$CREATED" \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --change "LABEL io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "$container" "$source_image"
          podman save --format oci-archive --output "ps-printer-app-${{ matrix.arch }}.tar" "$source_image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-ps-${{ matrix.arch }}
          path: ps-printer-app-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  publish-arch:
    needs: [metadata, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-ps-${{ matrix.arch }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes podman skopeo
      - name: Publish only a new immutable architecture tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          target="ghcr.io/${owner}/ps-printer-app:${VERSION}-${{ matrix.arch }}"
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if probe="$(skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://${target}" 2>&1)"; then
            printf 'Immutable architecture tag already exists: %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *'manifest unknown'* && "${probe,,}" != *'name unknown'* ]]; then
            printf 'Unable to establish architecture tag absence: %s\n' "$probe" >&2
            exit 1
          fi
          podman load --input "ps-printer-app-${{ matrix.arch }}.tar"
          podman push 'ghcr.io/projectbluefin/ps-printer-app:build' "docker://${target}"

  publish:
    needs: [metadata, publish-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Publish annotated amd64 and arm64 OCI index
        id: publish
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ps-printer-app"
          target="${image}:${VERSION}"
          authfile="$HOME/.docker/config.json"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${target}" 2>&1)"; then
            printf 'Immutable release tag already exists: %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *'manifest unknown'* && "${probe,,}" != *'name unknown'* ]]; then
            printf 'Unable to establish release tag absence: %s\n' "$probe" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            source="${image}:${VERSION}-$([[ "$arch" == amd64 ]] && echo x86_64 || echo aarch64)"
            actual="$(skopeo inspect --authfile "$authfile" "docker://${source}" | jq -r .Architecture)"
            [[ "$actual" == "$arch" ]]
            config="$(skopeo inspect --config --authfile "$authfile" "docker://${source}")"
            jq -e \
              --arg arch "$arch" --arg version "$VERSION" \
              --arg revision "$REVISION" --arg created "$CREATED" \
              --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
              --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
              '.architecture == $arch and
               .config.User == "65532:65532" and
               .config.Entrypoint == ["/usr/bin/catatonit", "--", "/usr/bin/bash", "/usr/libexec/ps-printer-app/container-entrypoint"] and
               .config.Labels["org.opencontainers.image.title"] == "ps-printer-app" and
               .config.Labels["org.opencontainers.image.source"] == $source_url and
               .config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0" and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$config"
          done
          docker buildx imagetools create \
            --tag "$target" \
            --annotation 'index:org.opencontainers.image.title=ps-printer-app' \
            --annotation 'index:org.opencontainers.image.description=PostScript Printer Application built from freedesktop-sdk' \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation 'index:org.opencontainers.image.licenses=Apache-2.0' \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${image}:${VERSION}-x86_64" "${image}:${VERSION}-aarch64"
          digest="$(skopeo inspect --authfile "$authfile" "docker://${target}" | jq -r .Digest)"
          [[ "$digest" == sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate source- and build-graph SPDX SBOM
        run: just sbom
      - name: Sign immutable image and attach signed SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=ps-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            ps-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify signed index, SPDX referrer and provenance
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@refs/tags/v${VERSION}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${SBOM_DIGEST}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" |
            jq -e --arg digest "$SBOM_DIGEST" \
              '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == 'amd64 arm64' ]]
          jq -e \
            --arg version "$VERSION" --arg revision "$REVISION" \
            --arg created "$CREATED" --arg fsdk_version "$FSDK_VERSION" \
            --arg fsdk_ref "$FSDK_REF" \
            --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.title"] == "ps-printer-app" and
             .annotations["org.opencontainers.image.source"] == $source_url and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["org.opencontainers.image.licenses"] == "Apache-2.0" and
             .annotations["io.projectbluefin.fsdk.version"] == $fsdk_version and
             .annotations["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$raw"
