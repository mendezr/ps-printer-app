name: FSDK image CI

on:
  push:
    branches: [testing]
    paths:
      - '.github/workflows/fsdk-ci.yml'
      - 'project.conf'
      - '*.refs'
      - '*ustfile'
      - 'elements/**'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.c'
      - '*.h'
      - '*.ppd'
      - '*.ps'
      - 'Makefile'
  pull_request:
    branches: [testing]
  merge_group:
    branches: [testing]
    paths:
      - '.github/workflows/fsdk-ci.yml'
      - 'project.conf'
      - '*.refs'
      - '*ustfile'
      - 'elements/**'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.c'
      - '*.h'
      - '*.ppd'
      - '*.ps'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prerequisites:
    name: Check FSDK integration prerequisites
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the FSDK graph
        id: check
        shell: bash
        run: |
          # Bootstrap only: issues #2-#5 supply the graph and real test harness.
          # A partial graph must fail rather than silently skip validation.
          if [[ ! -e project.conf && ! -d elements && ! -e Justfile && ! -e justfile ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::FSDK image validation is pending prerequisites #2-#5.'
            echo 'FSDK image jobs skipped: issues #2-#5 have not supplied the build graph and socket-sink harness. This is not image validation evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f project.conf
          test -f elements/oci/ps-printer-app.bst
          test -f Justfile || test -f justfile
          test -x tests/core-appliance.sh
          test -x tests/core-payload.sh
          echo 'available=true' >> "$GITHUB_OUTPUT"

  build-fsdk:
    name: FSDK (${{ matrix.arch }})
    needs: prerequisites
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report bootstrap status
        if: needs.prerequisites.outputs.available != 'true'
        run: |
          echo "FSDK image build skipped: bootstrap prerequisites pending."
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        if: needs.prerequisites.outputs.available == 'true'
        with:
          tool: just
      - name: Install host dependencies
        if: needs.prerequisites.outputs.available == 'true'
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Fetch sources with retries
        if: needs.prerequisites.outputs.available == 'true'
        run: just fetch
      - name: Build the full FSDK image
        if: needs.prerequisites.outputs.available == 'true'
        run: just build
      - name: Verify the appliance and real print-to-socket output
        if: needs.prerequisites.outputs.available == 'true'
        run: just verify
