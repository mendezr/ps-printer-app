name: FSDK image CI

on:
  pull_request:
    branches: [testing]
  merge_group:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prerequisites:
    name: Check FSDK integration prerequisites
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the FSDK graph
        id: check
        shell: bash
        run: |
          # Bootstrap only: issues #2-#5 supply the graph and real test harness.
          # A partial graph must fail rather than silently skip validation.
          if [[ ! -e project.conf && ! -d elements && ! -e Justfile && ! -e justfile ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::FSDK image validation is pending prerequisites #2-#5.'
            echo 'FSDK image jobs skipped: issues #2-#5 have not supplied the build graph and socket-sink harness. This is not image validation evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f project.conf
          test -f elements/oci/ps-printer-app.bst
          test -f Justfile || test -f justfile
          test -x tests/core-appliance.sh
          test -x tests/core-payload.sh
          echo 'available=true' >> "$GITHUB_OUTPUT"

  build-fsdk:
    name: FSDK (${{ matrix.arch }})
    needs: prerequisites
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report bootstrap status
        if: needs.prerequisites.outputs.available != 'true'
        run: |
          echo "FSDK image build skipped: bootstrap prerequisites pending."
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        if: needs.prerequisites.outputs.available == 'true'
        with:
          tool: just
      - name: Install host dependencies
        if: needs.prerequisites.outputs.available == 'true'
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      # ps_autoadd() against test doubles; needs only the runner's C compiler.
      - name: Unit tests
        if: needs.prerequisites.outputs.available == 'true'
        run: make test
      - name: Validate BuildStream graph
        if: env.FULL_BUILD != 'true' && needs.prerequisites.outputs.available == 'true'
        run: just validate
      - name: Compute BuildStream cache key
        id: bst-key
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ps-printer-app.c', 'ps-printer-app.1', 'ps-printer-app.service', 'generic-ps-printer.ppd', 'testpage.ps', 'VERSION') }}
        run: echo "hash=${INPUTS_HASH}" >> "$GITHUB_OUTPUT"
      # Restore only: pull_request and merge_group caches are not reusable by
      # other runs, so bst-cache.yml refills the cache from testing instead.
      - name: Restore BuildStream cache
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-
            bst-v1-${{ matrix.arch }}-
      - name: Install cosign
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build image
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/ps-printer-app.bst
      - name: Build the full FSDK image
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        run: just build
      - name: Verify the appliance and real print-to-socket output
        if: env.FULL_BUILD == 'true' && needs.prerequisites.outputs.available == 'true'
        run: just verify
